when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                # requêtes SQL : visibles dans le profiler, inutile de les recopier dans le log (et la console de symfony serve)
                channels: ["!event", "!doctrine"]

when@prod:
    monolog:
        handlers:
            # erreurs (dont les échecs d'envoi du formulaire de contact) dans var/log/prod.log
            main:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: error
                max_files: 30
